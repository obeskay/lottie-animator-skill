<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Lottie Animator</title>
  <desc id="desc">A dark motion design workspace showing an SVG path becoming a polished Lottie animation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#151126"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#334155"/>
  <rect x="32" y="32" width="500" height="296" rx="18" fill="#0b111a" stroke="#243244"/>
  <rect x="32" y="32" width="500" height="296" rx="18" fill="url(#grid)"/>
  <path d="M92 248C168 244 150 105 238 112s60 141 145 92 34-108 94-126" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <path d="M92 248C168 244 150 105 238 112s60 141 145 92 34-108 94-126" fill="none" stroke="#c084fc" stroke-opacity=".25" stroke-width="18" filter="url(#glow)"/>
  <g fill="#f8fafc" stroke="#8b5cf6" stroke-width="3"><circle cx="92" cy="248" r="8"/><circle cx="238" cy="112" r="8"/><circle cx="383" cy="204" r="8"/><circle cx="477" cy="78" r="8"/></g>
  <path d="M590 100h520M590 132h410M590 164h465" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
  <path d="M590 226h300" stroke="url(#violet)" stroke-width="10" stroke-linecap="round"/><path d="M590 258h420" stroke="url(#amber)" stroke-width="10" stroke-linecap="round"/>
  <text x="590" y="66" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="38" font-weight="800">Lottie Animator</text>
  <text x="590" y="304" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="20">SVG → motion, with intention.</text>
  <g transform="translate(1060 242)"><path d="M0 0l22 12-22 12 6-12z" fill="url(#amber)"/><circle cx="0" cy="12" r="5" fill="#f8fafc"/></g>
</svg>
