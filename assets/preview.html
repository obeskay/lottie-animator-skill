<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lottie Animator — examples</title>
<!--
  Serve this over HTTP, not file://. Browsers block fetch() from file:// URLs,
  so the player cannot load the JSON when the page is opened directly:

      python3 -m http.server 8000
      open http://localhost:8000/assets/preview.html
-->
<script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.12/dist/lottie-player.js"></script>
<style>
  :root {
    --bg: #090d16;
    --surface: #11161f;
    --line: #232a38;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --violet: #a855f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 24px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 36px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }
  figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
  }
  lottie-player { width: 100%; height: 200px; }
  figcaption { margin-top: 12px; }
  .name {
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--violet);
  }
  .what { color: var(--muted); font-size: 13px; margin-top: 2px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  code {
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
  }
</style>
</head>
<body>
<main>
  <h1>Lottie Animator</h1>
  <p class="lede">Every example here is linted and rendered in CI before it ships.</p>

  <div class="grid">
    <figure>
      <lottie-player src="../examples/rocket-launch.json" background="transparent"
                     speed="1" loop autoplay></lottie-player>
      <figcaption>
        <div class="name">rocket-launch.json</div>
        <div class="what">Staggered entrance, overshoot, drift. Converted from SVG.</div>
      </figcaption>
    </figure>

    <figure>
      <lottie-player src="../examples/logo-draw-on.json" background="transparent"
                     speed="1" loop autoplay></lottie-player>
      <figcaption>
        <div class="name">logo-draw-on.json</div>
        <div class="what">Gradient disc scales in, checkmark draws on with a trim path.</div>
      </figcaption>
    </figure>

    <figure>
      <lottie-player src="../examples/shape-morph.json" background="transparent"
                     speed="1" loop autoplay></lottie-player>
      <figcaption>
        <div class="name">shape-morph.json</div>
        <div class="what">True path morph, square to circle, on a closed loop.</div>
      </figcaption>
    </figure>

    <figure>
      <lottie-player src="../examples/panda-loader.json" background="transparent"
                     speed="1" loop autoplay></lottie-player>
      <figcaption>
        <div class="name">panda-loader.json</div>
        <div class="what">Seamless loading loop with secondary motion.</div>
      </figcaption>
    </figure>
  </div>

  <footer>
    Prefer a still comparison? Run <code>node scripts/render.mjs examples/&lt;file&gt;.json</code>
    and open the filmstrip it writes.
  </footer>
</main>
</body>
</html>
