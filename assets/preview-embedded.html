<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lottie Animator - Live Preview</title>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --primary: #6366f1;
      --accent: #f97316;
      --success: #22c55e;
      --text: #e5e5e5;
      --muted: #6b7280;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    
    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--primary), var(--accent), var(--success));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: var(--muted);
      margin-bottom: 40px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 900px;
      width: 100%;
    }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.2);
    }
    
    .card h3 {
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .card .tech {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 16px;
    }
    
    lottie-player {
      width: 100%;
      height: 200px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
    }
    
    .footer {
      margin-top: 60px;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }
    
    .footer a {
      color: var(--primary);
      text-decoration: none;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 100px;
      font-size: 12px;
      color: var(--primary);
      margin-bottom: 24px;
    }
    
    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.5); }
    }
  </style>
</head>
<body>
  <div class="badge">Live Preview</div>
  <h1>Lottie Animator</h1>
  <p class="subtitle">Example animations generated with AI</p>
  
  <div class="grid">
    <div class="card">
      <h3>Rocket Launch</h3>
      <p class="tech">Bounce + Scale + Particles</p>
      <lottie-player
        src="../examples/rocket-animated.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
    </div>
    
    <div class="card">
      <h3>Chimp Walk Pro</h3>
      <p class="tech">Frame-by-Frame Animation</p>
      <lottie-player
        src="../examples/chimp-walk-pro.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
    </div>
    
    <div class="card">
      <h3>Checkmark</h3>
      <p class="tech">Trim Path + Draw On</p>
      <lottie-player
        src="../test/checkmark-animation.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
    </div>
  </div>
  
  <div class="footer">
    <p>
      Made with <a href="https://github.com/obeskay/lottie-animator-skill">Lottie Animator</a> by 
      <a href="https://github.com/obeskay">@obeskay</a>
    </p>
    <p style="margin-top: 8px;">
      Drag any <code>.json</code> file to <a href="https://lottiefiles.com/preview">LottieFiles Preview</a> to test
    </p>
  </div>
</body>
</html>
